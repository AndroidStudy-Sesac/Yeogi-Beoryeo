name: API 28 Instrumented Tests

on:
  workflow_dispatch:

  schedule:
    - cron: '17 18 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-test-modules:
    name: API 28 Instrumented Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module: [app, data, presentation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "NAVER_CLIENT_ID=ci_dummy_naver_client_id" >> local.properties
          echo "PUBLIC_DATA_SERVICE_KEY=ci_dummy_public_data_service_key" >> local.properties

      - name: Create Firebase config
        run: |
          mkdir -p app/src/debug
          cat > app/src/debug/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-dummy-project",
              "storage_bucket": "ci-dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.team.yeogibeoryeo.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "ci_dummy_api_key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Install Android Emulator
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "emulator"

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Run API 28 instrumented tests
        shell: bash
        run: |
          ./gradlew \
            ":${{ matrix.module }}:pixel2Api28DebugAndroidTest" \
            --no-parallel \
            --no-daemon \
            --stacktrace \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Collect API 28 diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build/ci-diagnostics
          {
            printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -a
            nproc
            free -h
            df -h .
            ps -eo pid,comm,%cpu,%mem,rss --sort=-rss | sed -n '1,21p'
            java -version
            if [[ -x "$ANDROID_HOME/emulator/emulator" ]]; then
              "$ANDROID_HOME/emulator/emulator" -version
            fi
            if [[ -x "$ANDROID_HOME/platform-tools/adb" ]]; then
              "$ANDROID_HOME/platform-tools/adb" version
              "$ANDROID_HOME/platform-tools/adb" devices -l
            fi
            for package in \
              "$ANDROID_HOME/emulator/source.properties" \
              "$ANDROID_HOME/system-images/android-28/default/x86_64/source.properties"; do
              if [[ -f "$package" ]]; then
                printf '\n%s\n' "$package"
                cat "$package"
              fi
            done
          } > build/ci-diagnostics/environment.txt 2>&1

      - name: Upload API 28 test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api28-${{ matrix.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-diagnostics/
            ${{ matrix.module }}/build/reports/androidTests/
            ${{ matrix.module }}/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 14

  instrumented-test:
    name: API 28 Instrumented Tests
    needs: instrumented-test-modules
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify API 28 test results
        env:
          MODULE_RESULT: ${{ needs.instrumented-test-modules.result }}
        shell: bash
        run: |
          if [[ "$MODULE_RESULT" != "success" ]]; then
            echo "API 28 module tests did not all succeed: $MODULE_RESULT"
            exit 1
          fi

          echo "API 28 instrumented test gate passed."
