name: Android CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - '.github/workflows/android-ci.yml'
      - '.github/scripts/focused_coverage_summary.py'
      - '.github/scripts/test_focused_coverage_summary.py'
      - '.github/scripts/select_instrumented_test_tasks.py'
      - '.github/scripts/test_select_instrumented_test_tasks.py'
      - 'app/**'
      - 'common/**'
      - 'data/**'
      - 'domain/**'
      - 'presentation/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'

  push:
    branches:
      - develop
      - main
    paths:
      - '.github/workflows/android-ci.yml'
      - '.github/scripts/focused_coverage_summary.py'
      - '.github/scripts/test_focused_coverage_summary.py'
      - '.github/scripts/select_instrumented_test_tasks.py'
      - '.github/scripts/test_select_instrumented_test_tasks.py'
      - 'app/**'
      - 'common/**'
      - 'data/**'
      - 'domain/**'
      - 'presentation/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main') }}

      - name: Create local.properties for CI
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "NAVER_CLIENT_ID=ci_dummy_naver_client_id" >> local.properties
          echo "PUBLIC_DATA_SERVICE_KEY=ci_dummy_public_data_service_key" >> local.properties

      - name: Create Firebase config for CI
        run: |
          mkdir -p app/src/debug app/src/release
          cat > app/src/debug/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-dummy-project",
              "storage_bucket": "ci-dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.team.yeogibeoryeo.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "ci_dummy_api_key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cat > app/src/release/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-dummy-project",
              "storage_bucket": "ci-dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.team.yeogibeoryeo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "ci_dummy_api_key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Create release signing config for CI
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          keytool -genkeypair -noprompt \
            -keystore ci-release.jks \
            -storepass android \
            -keypass android \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI, OU=CI, O=YeogiBeoryeo, L=Seoul, ST=Seoul, C=KR"

          cat > keystore.properties <<'EOF'
          storeFile=ci-release.jks
          storePassword=android
          keyAlias=ci-release
          keyPassword=android
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run lint and builds
        shell: bash
        run: |
          set -euo pipefail

          tasks=(":app:lintDebug" ":app:assembleDebug")

          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "main" ]] || \
             [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            tasks+=(":app:assembleRelease" ":app:bundleRelease")
          fi

          echo "Selected Gradle tasks: ${tasks[*]}"
          ./gradlew "${tasks[@]}" --no-daemon --stacktrace -PciReleaseCheck=true

      - name: Validate release app bundle
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          set -euo pipefail

          aab_path="app/build/outputs/bundle/release/app-release.aab"
          bundletool_jar="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          bundletool_output="$RUNNER_TEMP/bundletool-validate.txt"

          test -f "$aab_path"
          echo "Release AAB path: $aab_path"
          echo "Release AAB size: $(stat -c %s "$aab_path") bytes"

          curl --fail --location --silent --show-error \
            --output "$bundletool_jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  ${bundletool_jar}" | sha256sum --check

          if ! java -jar "$bundletool_jar" validate --bundle="$aab_path" > "$bundletool_output" 2>&1; then
            cat "$bundletool_output"
            exit 1
          fi

          echo "bundletool validate: passed"

  determine-instrumented-tests:
    name: Determine Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_tests: ${{ steps.instrumented-tasks.outputs.has_tests }}
      matrix: ${{ steps.instrumented-tasks.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Determine instrumented test tasks
        id: instrumented-tasks
        shell: bash
        run: |
          set -euo pipefail

          changed_files_path="$(mktemp)"
          trap 'rm -f "$changed_files_path"' EXIT

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if ! git diff --name-only --no-renames \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.sha }}" \
              > "$changed_files_path"; then
              echo "::warning::변경 파일을 확인하지 못해 전체 계측 테스트를 실행합니다."
              : > "$changed_files_path"
            fi
          fi

          echo "Changed files:"
          cat "$changed_files_path"

          selection="$(python -X utf8 .github/scripts/select_instrumented_test_tasks.py \
            --event-name "${{ github.event_name }}" \
            < "$changed_files_path")"
          echo "$selection" >> "$GITHUB_OUTPUT"
          echo "$selection"

  instrumented-test-modules:
    name: Instrumented Test (${{ matrix.module }})
    needs: determine-instrumented-tests
    if: needs.determine-instrumented-tests.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-instrumented-tests.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main') }}

      - name: Create local.properties for CI
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "NAVER_CLIENT_ID=ci_dummy_naver_client_id" >> local.properties
          echo "PUBLIC_DATA_SERVICE_KEY=ci_dummy_public_data_service_key" >> local.properties

      - name: Create Firebase config for CI
        run: |
          mkdir -p app/src/debug
          cat > app/src/debug/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-dummy-project",
              "storage_bucket": "ci-dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.team.yeogibeoryeo.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "ci_dummy_api_key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Run instrumented tests
        run: |
          ./gradlew \
            "${{ matrix.task }}" \
            -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" \
            --no-parallel \
            --no-daemon \
            --stacktrace \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

  instrumented-test:
    name: Instrumented Tests
    needs:
      - determine-instrumented-tests
      - instrumented-test-modules
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify instrumented test results
        env:
          DETECTION_RESULT: ${{ needs.determine-instrumented-tests.result }}
          HAS_TESTS: ${{ needs.determine-instrumented-tests.outputs.has_tests }}
          MODULE_RESULT: ${{ needs.instrumented-test-modules.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DETECTION_RESULT" != "success" ]]; then
            echo "계측 테스트 대상을 확인하지 못했습니다."
            exit 1
          fi

          if [[ "$HAS_TESTS" != "true" && "$HAS_TESTS" != "false" ]]; then
            echo "계측 테스트 실행 여부가 올바르지 않습니다."
            exit 1
          fi

          if [[ "$HAS_TESTS" == "true" && "$MODULE_RESULT" != "success" ]]; then
            echo "하나 이상의 module 계측 테스트가 실패하거나 취소됐습니다."
            exit 1
          fi

          if [[ "$HAS_TESTS" == "false" && "$MODULE_RESULT" != "skipped" ]]; then
            echo "계측 테스트 대상이 없지만 module job이 실행됐습니다."
            exit 1
          fi

          echo "Instrumented test gate passed."

  focused-coverage:
    name: Focused Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main') }}

      - name: Create local.properties for CI
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "NAVER_CLIENT_ID=ci_dummy_naver_client_id" >> local.properties
          echo "PUBLIC_DATA_SERVICE_KEY=ci_dummy_public_data_service_key" >> local.properties

      - name: Create Firebase config for CI
        run: |
          mkdir -p app/src/debug
          cat > app/src/debug/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-dummy-project",
              "storage_bucket": "ci-dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.team.yeogibeoryeo.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "ci_dummy_api_key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Generate focused coverage reports
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :koverXmlReportFocused \
            :koverHtmlReportFocused \
            --no-daemon \
            --stacktrace

      - name: Upload focused coverage reports
        id: focused-coverage-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focused-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/kover/focused/html
            build/reports/kover/focused/report.xml
          if-no-files-found: error
          retention-days: 14

      - name: Print focused coverage summary
        if: always()
        shell: bash
        run: |
          report_path='build/reports/kover/focused/report.xml'
          if [[ -f "$report_path" ]]; then
            python -X utf8 .github/scripts/focused_coverage_summary.py \
              --report "$report_path" \
              --properties gradle.properties \
              --commit "${{ github.sha }}" \
              --artifact-url "${{ steps.focused-coverage-artifact.outputs.artifact-url }}" \
              --policy-url "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/testing/focused-coverage.md" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Focused coverage report를 생성하지 못했습니다.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Test CI helper scripts
        run: |
          python -X utf8 -m unittest discover -s .github/scripts -p 'test_*.py'
